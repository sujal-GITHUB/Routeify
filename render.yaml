services:
  - type: web
    name: routeify-backend
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production

  - type: static
    name: routeify-frontend
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BASE_URL
        value: https://routeify-backend.onrender.com
      - key: NODE_ENV
        value: production
